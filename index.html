<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Binding of Aavarvd</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--s:3;color-scheme:dark;--bg:#07050c;--fg:#e9e2f5;--ac:#ff5d73}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Press Start 2P",monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
#w{position:relative;width:calc(240px*var(--s));height:calc(200px*var(--s));box-shadow:0 0 60px #3a1a6a66}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block;cursor:crosshair}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*5px);background:#07050ccc;text-align:center;font-size:calc(var(--s)*3.2px);line-height:1.6;padding:calc(var(--s)*6px);box-sizing:border-box}
#ov h1{font-size:calc(var(--s)*8px);margin:0;color:var(--ac);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #5b2a9a}
#ov p{margin:0;max-width:90%;color:#bdb2d6}
.row{display:flex;gap:calc(var(--s)*4px)}
button,.card{font:inherit;color:var(--fg);background:#1a1230;border:calc(var(--s)*.7px) solid #6b4bb0;padding:calc(var(--s)*3px);cursor:pointer}
button:hover,.card:hover{background:#2c1d52;border-color:var(--ac)}
.card{width:calc(var(--s)*62px);display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*2px)}
.card img{width:calc(var(--s)*16px);height:calc(var(--s)*16px);image-rendering:pixelated}
.card b{color:#ffd36b}.card span{color:#bdb2d6;font-size:calc(var(--s)*2.7px)}
</style></head><body>

function shatter(s,x,y){if(s.gen>0&&!s.ec)return;const a0=R(0,6.28);for(let i=0;i<3;i++){const a=a0+i*2.094,sp=110;S.sh_.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:s.dmg*.5,r:2,l:.45,b:0,gen:s.gen+1,h:[],ec:0,sh:1})}part(x,y,'#9fe8ff',5);sfx(900,.06,'triangle',.04,-400)}

function hurt(n,fx,fy){if(S.iv>0||S.mode!='play')return;if(has('aegis')&&S.sh){S.sh=0;S.shT=9;S.iv=.5;sfx(200,.2,'sine',.08,300);part(S.x,S.y,'#7fd4ff',10);return}
S.hp-=n*(has('curse')?2:1);S.iv=1.1;S.shake=5;sfx(110,.25,'sawtooth',.08,-60);part(S.x,S.y,'#ff5d73',8);if(S.hp<=0){S.hp=0;S.mode='dead';SV.d++;save();setTimeout(deadScr,900)}}

function hitE(e,s){if(e.t=='mimic')e.aw=1;if(e.t=='spirit'&&e.st==1||e.sp>0)return 0;return 1}
// update
function upd(dt){const s=S;s.t+=dt;if(s.mode=='play'||s.mode=='clr'){
for(const k in s.dis)if((s.dis[k]-=dt)<=0)delete s.dis[k];
if(s.iv>0)s.iv-=dt;if(s.shT>0&&(s.shT-=dt)<=0)s.sh=1;
let ix=(K.d||0)-(K.a||0),iy=(K.s||0)-(K.w||0);if(ix||iy){const l=Math.hypot(ix,iy),v=82*dt/l;mvP(ix*v,iy*v);s.mv+=dt}
let ax=(K.arrowright||0)-(K.arrowleft||0),ay=(K.arrowdown||0)-(K.arrowup||0),a=Math.atan2(my-s.y,mx-s.x),f=md||K[' ']||ax||ay;if(ax||ay)a=Math.atan2(ay,ax);
s.aim=a;s.face=Math.abs(Math.cos(a))>Math.abs(Math.sin(a))?(Math.cos(a)<0?2:3):(Math.sin(a)<0?1:0);
if((s.fd-=dt)<=0&&f){fire(a);s.ft=.12}if(s.ft>0)s.ft-=dt;
DR.forEach((d,i)=>{if(s.r.open&&s.r.nb[i]&&((d.dx<0&&s.x<5)||(d.dx>0&&s.x>W-5)||(d.dy<0&&s.y<5)||(d.dy>0&&s.y>H-5))){const dir=i;enter(s.r.nb[i],i^1);if(s.r.t!='start'&&!s.r.clr)sfx(150,.3,'sawtooth',.06)}})
// shots
for(const b of s.sh_){if(b.ec){b.i+=2;const p=b.path[Math.floor(b.i)];if(!p){if(has('glass'))shatter(b,b.x,b.y);b.dead=1;continue}b.x=p.x;b.y=p.y;continue}
b.l-=dt;if(has('grav')){let n=null,nd=100;for(const e of s.es)if(!e.sp>0||0){const d=D(b.x,b.y,e.x,e.y);if(d<nd){nd=d;n=e}}if(n){let an=Math.atan2(b.vy,b.vx),da=Math.atan2(n.y-b.y,n.x-b.x)-an;da=Math.atan2(Math.sin(da),Math.cos(da));const tr=(has('fat')?1.5:5)*dt;an+=Math.max(-tr,Math.min(tr,da));const sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(an)*sp;b.vy=Math.sin(an)*sp}}
const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;if(blk(nx,ny,0)){if(has('glass'))shatter(b,b.x,b.y);if(b.b>0){b.b--;if(blk(nx,b.y,0))b.vx*=-1;if(blk(b.x,ny,0))b.vy*=-1;if(!blk(nx,b.y,0)&&!blk(b.x,ny,0)){b.vx*=-1;b.vy*=-1}b.l+=.25;sfx(520,.04,'square',.03)}else kill(b);continue}
b.x=nx;b.y=ny;b.h.push({x:b.x,y:b.y});if(b.h.length>45)b.h.shift();if(b.l<=0)kill(b)}
for(const b of s.sh_){if(b.dead)continue;for(const e of s.es){if(e.sp>0||e.dead||(e.t=='spirit'&&e.st==1))continue;if(D(b.x,b.y,e.x,e.y)<e.r+b.r){if(b.ec){if(e.ect>0)continue;e.ect=.2}hitE(e,b);e.hp-=b.dmg;e.fl=.1;part(b.x,b.y,'#fff',3);sfx(260,.05,'square',.04);if(e.t=='mimic')e.aw=1;if(!b.ec){if(has('glass'))shatter(b,b.x,b.y);kill(b);break}}}}
s.sh_=s.sh_.filter(b=>!b.dead);if(s.sh_.length>300)s.sh_.splice(0,60);
// enemies
for(const e of s.es){e.fl-=dt;e.ect-=dt;if(e.sp>0){e.sp-=dt;continue}const dx=s.x-e.x,dy=s.y-e.y,d=Math.hypot(dx,dy)||1,an=Math.atan2(dy,dx);e.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0);
const step=(vx,vy)=>{const nx=e.x+vx*dt,ny=e.y+vy*dt;if(!blk(nx,e.y,1)||e.t=='boss')e.x=nx;if(!blk(e.x,ny,1)||e.t=='boss')e.y=ny;e.x=Math.max(24,Math.min(216,e.x));e.y=Math.max(24,Math.min(152,e.y))};
if(e.t=='skull')step(dx/d*(24+s.r.dp*4),dy/d*(24+s.r.dp*4));
else if(e.t=='octo'){const v=d>75?1:d<50?-1:0;step(dx/d*v*34-dy/d*14*Math.sin(e.tm),dy/d*v*34+dx/d*14*Math.sin(e.tm));if((e.tm-=dt)<=0){e.tm=R(1.4,2.2);eshot(e.x,e.y,an,70);sfx(300,.1,'sawtooth',.03,-100)}}
else if(e.t=='spirit'){e.tm-=dt;if(e.st==0){step(dx/d*30,dy/d*30);e.al=1;if(e.tm<=0){e.st=1;e.tm=.45}}else{e.al=.2;if(e.tm<=0){e.x=R(28,212);e.y=R(28,148);e.st=0;e.tm=R(1.4,2);eshot(e.x,e.y,Math.atan2(s.y-e.y,s.x-e.x),80);part(e.x,e.y,'#bfefff',8);s.gl=.1}}}
else if(e.t=='mimic'){if(!e.aw){if(d<34)e.aw=1}else{e.tm-=dt;if(e.tm<0){e.vx=dx/d*130;e.vy=dy/d*130;e.tm=R(1.1,1.6);e.lt=.35}if(e.lt>0){e.lt-=dt;step(e.vx,e.vy)}}}
else if(e.t=='boss'){step(Math.sign(dx)*Math.min(26,Math.abs(dx)),0);e.tm-=dt;if(e.tm<=0){e.tm=1.4;e.st++;if(e.st%2){const o=R(0,6);for(let i=0;i<12;i++)eshot(e.x,e.y+8,o+i*.5236,60)}else for(let i=-2;i<=2;i++)eshot(e.x,e.y+8,an+i*.2,85);sfx(90,.2,'sawtooth',.07,-30)}
if((s.aT-=dt)<=0){s.aT=8;const o=s.own.filter(i=>!s.dis[i]);s.gl=.5;s.shake=6;if(o.length){const k=o[RI(o.length)];s.dis[k]=6.5;toast('AUDIT: '+BM[k].n.toUpperCase()+' OFF')}else toast('AUDIT FAILED. NO BINDINGS.');sfx(70,.5,'sawtooth',.1,-20)}
if(e.hp<35&&!e.sum){e.sum=1;s.es.push(mk('skull',50,50),mk('skull',190,50));toast('THE AUDITOR CALLS BACKUP')}}
if(e.t!='boss'&&e.t!='octo'&&d<e.r+5&&(e.t!='mimic'||e.aw)&&e.st!=1)hurt(1);if(e.t=='boss'&&d<22)hurt(1)}
for(const e of s.es)if(e.hp<=0&&!e.dead){e.dead=1;s.kills++;part(e.x,e.y,e.t=='boss'?'#ffb347':'#ffd36b',e.t=='boss'?40:12,90);s.fx.push({x:e.x,y:e.y,t:0,big:e.t=='boss'});s.shake=e.t=='boss'?10:2;sfx(160,.2,'sawtooth',.07,-100);if(has('leech')&&Math.random()<.3&&s.hp<s.mh)s.hp++;if(Math.random()<.1)s.pk.push({x:e.x,y:e.y})}
s.es=s.es.filter(e=>!e.dead);
for(const b of s.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(blk(b.x,b.y,0)||b.l<=0)b.dead=1;else if(D(b.x,b.y,s.x,s.y)<6){b.dead=1;hurt(1)}}s.eb=s.eb.filter(b=>!b.dead);

if(!s.r.clr&&s.mode=='play'&&s.es.length==0&&s.r.t!='start'){s.r.clr=1;s.r.open=true;sfx(520,.3,'triangle',.06,300);if(s.r.t=='boss'){s.mode='clr';setTimeout(winScr,1600)}else{toast('ROOM CLEARED');s.mode='clr';setTimeout(()=>pickScr(),700)}}}
for(const p of s.ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}s.ps=s.ps.filter(p=>p.l>0);for(const f of s.fx)f.t+=dt;s.fx=s.fx.filter(f=>f.t<.6);
s.shake*=.88;if(s.gl>0)s.gl-=dt;s.msg.forEach(m=>m.l-=dt);s.msg=s.msg.filter(m=>m.l>0)}
// reward / screens
let cho=[];
function pickScr(){S.mode='pick';const pool=BD.filter(b=>!S.own.includes(b.id)&&(!b.lock||SV.w>0));cho=pool.sort(()=>Math.random()-.5).slice(0,3);if(!cho.length){S.hp=S.mh;S.mode='play';return}

// draw
const wall=document.createElement('canvas');wall.width=W;wall.height=H;
function spr(i,sx,sy,sw,sh,x,y,sc=1){g.drawImage(IM[i],sx,sy,sw,sh,Math.round(x-sw*sc/2),Math.round(y-sh*sc/2),sw*sc,sh*sc)}

function draw(){const s=S;g.fillStyle='#07050c';g.fillRect(0,0,W,200);const r=s.r;if(!r.cv)bake(r);

ent.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
for(const b of s.sh_){if(b.ec){g.globalAlpha=.7;spr('energy',Math.floor(tt*12)%4*16,0,16,16,b.x,b.y,b.r/4+.4);g.globalAlpha=1;continue}
g.save();g.translate(b.x,b.y);g.rotate(tt*18);const z=b.r/4.5;g.drawImage(IM.shur,-7.5*z,-7.5*z,15*z,15*z);g.restore();if(has('glass')&&!b.sh){g.fillStyle='#9fe8ff88';g.fillRect(b.x-1,b.y-1,2,2)}}
for(const b of s.eb)spr('fire',Math.floor(tt*10)%4*16,0,16,16,b.x,b.y);

for(const f of s.fx){const i=Math.min(8,Math.floor(f.t/.6*9));spr('expl',i*40,0,40,40,f.x,f.y,f.big?2:.8)}
g.restore();
// glitch slices
if(s.gl>0){for(let i=0;i<7;i++){const y=RI(190);g.drawImage(cv,0,y,W,R(3,12),R(-8,8),y,W,8)}g.fillStyle='#ff005512';g.fillRect(0,0,W,200)}

g.font='8px "Press Start 2P",monospace';g.textAlign='left';
const xs=s.rs.map(q=>q.x),ys=s.rs.map(q=>q.y),x0=Math.min(...xs),y0=Math.min(...ys);for(const q of s.rs){if(!q.vis&&!q.nb.some(n=>n&&n.vis))continue;g.fillStyle=q==s.r?'#fff':q.t=='boss'?'#f55':q.clr||q.t=='start'?'#7a5ad0':'#3b2470';g.fillRect(190+(q.x-x0)*8,3+(q.y-y0)*6,6,4);q.nb.forEach((n,i)=>{if(n&&(q.vis||n.vis)){g.fillStyle=q.vis&&n.vis?'#7a5ad0':'#3b2470';const d=DR[i];g.fillRect(190+(q.x-x0)*8+d.dx*2+2,3+(q.y-y0)*6+d.dy*2+1,2,2)}})}

s.msg.slice(-2).forEach((m,i)=>{g.globalAlpha=Math.min(1,m.l);g.textAlign='center';const c=m.t.startsWith('AUDIT')?'#ff5d73':m.t.startsWith('SYN')?'#7fe8ff':'#ffd36b';if(c!='#ffd36b'){g.fillStyle='#000a';const w=g.measureText(m.t).width+6;g.fillRect(120-w/2,OY+14+i*11,w,10)}g.fillStyle=c;g.fillText(m.t,120,OY+22+i*11);g.globalAlpha=1});
